name: Polite scraper offline verification
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check every offline parsing and pipeline checkpoint
        run: python -m pytest -q
      - name: Validate published sample data without making web requests
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from src.models import BookRecord
          data = json.loads(Path('output/books.json').read_text(encoding='utf-8'))
          assert len(data) == 60
          assert len({row['product_url'] for row in data}) == 60
          for row in data:
              record = BookRecord.model_validate(row)
              assert record.price_gbp >= 0
              assert row['price_text'].startswith('£')
          print('PASS: 60 unique, schema-valid saved book records')
          PY
